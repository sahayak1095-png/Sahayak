name: Full Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.set-api-url.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render backend deploy
        id: deploy-backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl -s -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}')
          echo "Render deploy response:"
          cat "$RESPONSE_FILE"
          if [ "$STATUS_CODE" != "201" ] && [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "202" ]; then
            echo "Render deploy request failed with status $STATUS_CODE"
            exit 1
          fi

      - name: Register backend custom domain on Render
        if: secrets.RENDER_BACKEND_URL != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          DOMAIN=$(python3 - <<'PY'
import os, urllib.parse, sys
url = os.getenv('RENDER_BACKEND_URL', '').strip()
if not url:
    sys.exit(1)
if '://' not in url:
    url = 'https://' + url
parsed = urllib.parse.urlparse(url)
if not parsed.hostname:
    sys.exit(1)
print(parsed.hostname)
PY
)
          if [ -z "$DOMAIN" ]; then
            echo "No backend custom domain configured."
            exit 0
          fi
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl -s -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/custom-domains" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${DOMAIN}\"}")
          echo "Render custom domain response:"
          cat "$RESPONSE_FILE"
          if [ "$STATUS_CODE" = "201" ] || [ "$STATUS_CODE" = "409" ]; then
            echo "Render backend custom domain ${DOMAIN} registered or already exists."
          else
            echo "Failed to add Render custom domain (HTTP $STATUS_CODE)"
            exit 1
          fi

      - name: Set API URL output
        id: set-api-url
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          URL="${URL%/}"
          if [[ "$URL" != */api ]]; then
            URL="$URL/api"
          fi
          echo "api_url=$URL" >> $GITHUB_OUTPUT

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: ./Sahayak.Frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./Sahayak.Frontend

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          working-directory: ./Sahayak.Frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ needs.deploy-backend.outputs.api_url }}

      - name: Register custom domain in Vercel
        if: secrets.VERCEL_DOMAIN != ''
        run: |
          DOMAIN="${{ secrets.VERCEL_DOMAIN }}"
          PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}"
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          echo "Registering domain ${DOMAIN} to Vercel project ${PROJECT_ID}"
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl -s -o "$RESPONSE_FILE" -w '%{http_code}' -X POST "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$DOMAIN\"}")
          if [ "$STATUS_CODE" = "200" ] || [ "$STATUS_CODE" = "201" ] || [ "$STATUS_CODE" = "409" ]; then
            python3 - <<'PY'
import json, sys
resp = json.load(open(sys.argv[1]))
print('Domain registration response:')
print('  name:', resp.get('name'))
if 'dnsRecords' in resp:
    print('DNS records:')
    for rec in resp['dnsRecords']:
        print(f"  {rec.get('type')} {rec.get('name')} {rec.get('value','')}")
PY
 "$RESPONSE_FILE"
          else
            echo "Failed to add Vercel domain (HTTP $STATUS_CODE)"
            cat "$RESPONSE_FILE"
            exit 1
          fi
