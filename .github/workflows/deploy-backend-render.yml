name: Deploy Backend to Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Sahayak.Backend/**'
      - '.github/workflows/deploy-backend-render.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render backend deploy
        run: |
          echo "Render deploy is handled by the Render service auto-deploy setting."
          echo "If you want to trigger a deployment manually, use the Render dashboard or enable auto-deploy for this service."

      - name: Register backend custom domain on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$RENDER_BACKEND_URL" ]; then
            echo "No backend custom domain configured."
            exit 0
          fi
          DOMAIN=$(python3 - <<'PY'
          import os, urllib.parse, sys
          url = os.getenv('RENDER_BACKEND_URL', '').strip()
          if not url:
              sys.exit(1)
          if '://' not in url:
              url = 'https://' + url
          parsed = urllib.parse.urlparse(url)
          if not parsed.hostname:
              sys.exit(1)
          print(parsed.hostname)
          PY
          )
          if [ -z "$DOMAIN" ]; then
            echo "No backend custom domain configured."
            exit 0
          fi
          if [[ "$DOMAIN" == *.onrender.com ]] || [[ "$DOMAIN" == *.render.com ]]; then
            echo "Skipping Render custom domain registration for default Render host: $DOMAIN"
            exit 0
          fi
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl -s -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/custom-domains" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${DOMAIN}\"}")
          echo "Render custom domain response:"
          cat "$RESPONSE_FILE"
          if [ "$STATUS_CODE" = "201" ] || [ "$STATUS_CODE" = "409" ]; then
            echo "Render backend custom domain ${DOMAIN} registered or already exists."
          else
            echo "Failed to add Render custom domain (HTTP $STATUS_CODE)"
            exit 1
          fi
