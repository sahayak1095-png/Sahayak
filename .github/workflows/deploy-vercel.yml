name: Deploy Frontend to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Sahayak.Frontend/**'
      - '.github/workflows/deploy-vercel.yml'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./Sahayak.Frontend
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@54.21.1

      - name: Verify Vercel CLI version
        run: vercel --version

      - name: Build frontend
        working-directory: ./Sahayak.Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Vercel
        working-directory: ./Sahayak.Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_NAME: ${{ secrets.VERCEL_GIT_NAME }}
          VERCEL_GIT_EMAIL: ${{ secrets.VERCEL_GIT_EMAIL }}
        run: |
          if [ -n "$VERCEL_GIT_NAME" ]; then git config user.name "$VERCEL_GIT_NAME"; fi
          if [ -n "$VERCEL_GIT_EMAIL" ]; then git config user.email "$VERCEL_GIT_EMAIL"; fi
          vercel --prod --token "$VERCEL_TOKEN" --yes --cwd . --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"

      - name: Register Vercel custom domain
        working-directory: ./Sahayak.Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DOMAIN: ${{ secrets.VERCEL_DOMAIN }}
        run: |
          if [ -z "$VERCEL_DOMAIN" ]; then
            echo "No Vercel custom domain configured."
            exit 0
          fi
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl -s -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$VERCEL_DOMAIN\"}")
          echo "Vercel domain response:"
          cat "$RESPONSE_FILE"
          if [ "$STATUS_CODE" = "200" ] || [ "$STATUS_CODE" = "201" ] || [ "$STATUS_CODE" = "409" ]; then
            echo "Domain registered or already exists."
          else
            echo "Failed to add Vercel domain (HTTP $STATUS_CODE)"
            exit 1
          fi
